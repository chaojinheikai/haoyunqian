<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>好运签 LUCK NOTE · 今天的好运已为你备好</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
/* === RESET === */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

/* === COLOR VARIABLES (from design spec) === */
:root{
  /* 主色 */
  --c-purple-light:#8D7988;
  --c-purple-deep:#66567F;
  --c-cream:#F6F1E9;
  --c-ink:#27242B;
  /* 辅助色 */
  --c-pink:#E8A39C;
  --c-yellow:#E8D69A;
  --c-lilac:#DDD5E8;
  --c-taro:#C987D9;
  /* 功能色 */
  --c-success:#6BC3A1;
  --c-info-blue:#7DA2E6;
  /* 背景 */
  --bg-main:#F6F1E9;
  --bg-card:#FFFCF6;
  --bg-dark:#27242B;
  /* 文字 */
  --text-main:#27242B;
  --text-sub:#8D7988;
  --text-light:#B0A8B0;
  /* 动效 */
  --ease:cubic-bezier(.22,.61,.36,1);
  --dur-fast:300ms;
  --dur-mid:450ms;
  --dur-slow:600ms;
}

body{
  font-family:"Songti SC","SimSun","Noto Serif SC","Source Han Serif CN",serif;
  background:var(--bg-main);
  color:var(--text-main);
  -webkit-font-smoothing:antialiased;
  transition:background var(--dur-slow) var(--ease);
}
/* Sans fallback for UI text */
.sans{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}

/* === PAGES === */
.page{
  position:fixed;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity var(--dur-mid) var(--ease);z-index:1;
}
.page.active{opacity:1;pointer-events:auto;z-index:2}
.page-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* === SHARED ANIMATIONS === */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:0.3}50%{opacity:1}}
@keyframes floatSoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glowPulse{0%,100%{opacity:0.2}50%{opacity:0.5}}
@keyframes starSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* === STAR ICON (brand) === */
.star-icon{display:inline-block;width:1em;height:1em;position:relative;transform:rotate(0deg)}
.star-icon svg{width:100%;height:100%}

/* === PAGE: TODAY (首页) === */
#page-today{background:var(--bg-main);padding:0 24px}
.today-nav{display:flex;align-items:center;justify-content:space-between;padding:48px 0 0}
.today-nav-brand{font-size:20px;font-weight:600;letter-spacing:4px;color:var(--text-main)}
.today-nav-fav{width:32px;height:32px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-purple-light);opacity:0.7;transition:opacity var(--dur-fast)}
.today-nav-fav:active{opacity:1;transform:scale(0.9)}

.today-date{margin-top:40px;opacity:0;animation:fadeUp var(--dur-slow) 0.1s var(--ease) forwards}
.today-date-day{font-size:64px;font-weight:300;line-height:1;color:var(--text-main);letter-spacing:-2px}
.today-date-meta{font-size:13px;color:var(--text-sub);letter-spacing:3px;margin-top:4px;font-family:"PingFang SC","Noto Sans SC",sans-serif}

.today-note{margin-top:36px;padding:20px 0;border-top:1px solid rgba(141,121,136,0.12);border-bottom:1px solid rgba(141,121,136,0.12);display:flex;align-items:center;justify-content:space-between;opacity:0;animation:fadeUp var(--dur-slow) 0.3s var(--ease) forwards}
.today-note-label{font-size:11px;color:var(--text-sub);letter-spacing:2px;font-family:"PingFang SC","Noto Sans SC",sans-serif;margin-bottom:6px}
.today-note-text{font-size:16px;color:var(--text-main);line-height:1.6}
.today-note-arrow{color:var(--c-purple-light);font-size:18px;transition:transform var(--dur-fast) var(--ease)}
.today-note:hover .today-note-arrow{transform:translateX(4px)}

.today-prompt{margin-top:40px;font-size:17px;color:var(--text-main);letter-spacing:1px;opacity:0;animation:fadeUp var(--dur-slow) 0.5s var(--ease) forwards}

.mood-list{margin-top:28px;display:flex;flex-direction:column;gap:14px;opacity:0;animation:fadeUp var(--dur-slow) 0.7s var(--ease) forwards}
.mood-item{
  display:flex;align-items:center;gap:16px;
  padding:18px 22px;background:var(--bg-card);border-radius:16px;
  border:1px solid rgba(141,121,136,0.08);
  cursor:pointer;transition:all var(--dur-fast) var(--ease);
}
.mood-item:active{transform:scale(0.98);border-color:var(--c-purple-light);box-shadow:0 4px 20px rgba(141,121,136,0.08)}
.mood-num{font-size:12px;color:var(--text-light);letter-spacing:1px;font-family:"PingFang SC","Noto Sans SC",sans-serif;min-width:24px}
.mood-symbol{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mood-symbol svg{width:24px;height:24px}
.mood-label{font-size:16px;color:var(--text-main);letter-spacing:1px;flex:1}

/* === PAGE: DRAW (抽签引导) === */
#page-draw{background:var(--bg-dark);align-items:center;justify-content:center;padding:24px}
.draw-stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.draw-star{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.6);animation:twinkle 3s ease-in-out infinite}
.draw-text{font-size:18px;color:rgba(255,255,255,0.9);letter-spacing:3px;text-align:center;margin-bottom:60px;opacity:0;animation:fadeIn var(--dur-slow) 0.3s forwards;line-height:1.8}
.draw-star-center{
  width:80px;height:80px;display:flex;align-items:center;justify-content:center;
  margin-bottom:40px;opacity:0;animation:scaleIn var(--dur-slow) 0.5s forwards;
}
.draw-star-center svg{width:60px;height:60px;filter:drop-shadow(0 0 20px rgba(201,135,217,0.4))}
.draw-star-center .star-rotate{animation:starSpin 8s linear infinite}
.draw-dots{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:40px;opacity:0;animation:fadeIn var(--dur-slow) 0.8s forwards}
.draw-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.3)}
.draw-prompt{font-size:16px;color:rgba(255,255,255,0.6);letter-spacing:3px;opacity:0;animation:fadeIn var(--dur-slow) 1s forwards;cursor:pointer}
.draw-prompt:active{color:rgba(255,255,255,0.9)}
.draw-card-stage{perspective:1200px;width:min(78vw,300px);height:min(110vw,420px);cursor:pointer;opacity:0;animation:scaleIn var(--dur-slow) 0.5s forwards}
.draw-card-3d{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.2s var(--ease)}
.draw-card-3d.flipped{transform:rotateY(180deg)}
.draw-card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;overflow:hidden}
.draw-card-back{
  background:linear-gradient(180deg,#2A2730 0%,#1A1820 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid rgba(201,135,217,0.15);
}
.draw-card-back .star-icon{width:36px;height:36px;margin-bottom:20px;opacity:0.6}
.draw-card-back-label{font-size:16px;color:rgba(255,255,255,0.5);letter-spacing:6px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.draw-card-back-hint{position:absolute;bottom:28px;font-size:12px;color:rgba(255,255,255,0.3);letter-spacing:2px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.draw-card-front{
  transform:rotateY(180deg);
  background:var(--bg-card);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px 28px;border:1px solid var(--c-lilac);
}
.draw-card-front::before{content:'';position:absolute;top:16px;left:16px;right:16px;bottom:16px;border:1px solid rgba(141,121,136,0.1);border-radius:6px;pointer-events:none}
.draw-card-text{font-size:19px;font-weight:400;line-height:2.2;color:var(--text-main);text-align:center;position:relative;z-index:1}
.draw-card-brand{position:absolute;bottom:24px;left:28px;font-size:12px;color:var(--c-purple-light);letter-spacing:3px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.draw-card-date{position:absolute;bottom:24px;right:28px;font-size:11px;color:var(--text-light);letter-spacing:1px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.draw-card-stage:not(.flipping) .draw-card-3d:not(.flipped){animation:floatSoft 4s ease-in-out infinite}
.draw-card-stage:not(.flipping) .draw-card-back::after{
  content:'';position:absolute;inset:0;border-radius:12px;
  background:radial-gradient(circle at 50% 50%,rgba(201,135,217,0.08) 0%,transparent 70%);
  animation:glowPulse 3s ease-in-out infinite;pointer-events:none;
}

/* === PAGE: RESULT (签文结果) === */
#page-result{background:var(--bg-main);align-items:center;justify-content:center;padding:24px;padding-top:8vh}
.result-nav{position:absolute;top:48px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;opacity:0;animation:fadeIn var(--dur-mid) 0.2s forwards}
.result-nav-btn{width:32px;height:32px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-purple-light);opacity:0.7;transition:opacity var(--dur-fast)}
.result-nav-btn:active{opacity:1;transform:scale(0.9)}

.result-card{
  width:min(82vw,320px);min-height:min(90vw,340px);border-radius:16px;
  background:var(--bg-card);padding:44px 32px 36px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid rgba(141,121,136,0.08);position:relative;
  opacity:0;transform:scale(0.94) translateY(10px);
  animation:scaleIn var(--dur-slow) 0.15s var(--ease) forwards;
  box-shadow:0 8px 40px rgba(39,36,43,0.04);
  transition:border-color var(--dur-mid) var(--ease),box-shadow var(--dur-mid) var(--ease);
}
.result-card::before{content:'';position:absolute;top:14px;left:14px;right:14px;bottom:14px;border:1px solid rgba(141,121,136,0.06);border-radius:8px;pointer-events:none}
.result-date{font-size:14px;color:var(--text-sub);letter-spacing:2px;margin-bottom:24px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.result-divider{width:32px;height:1px;background:var(--c-purple-light);opacity:0.3;margin-bottom:24px}
.result-text{font-size:20px;font-weight:400;line-height:2.2;color:var(--text-main);text-align:center;flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;max-width:260px}
.result-sub{font-size:13px;color:var(--text-sub);letter-spacing:1px;margin-top:16px;text-align:center;line-height:1.6}
.result-tone-label{font-size:11px;color:var(--text-light);letter-spacing:2px;margin-top:28px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.result-tone-color{display:flex;align-items:center;gap:8px;margin-top:8px}
.result-tone-swatch{width:16px;height:16px;border-radius:50%;transition:background var(--dur-mid) var(--ease)}
.result-tone-name{font-size:12px;color:var(--text-sub);font-family:"PingFang SC","Noto Sans SC",sans-serif}
.result-actions{display:flex;gap:16px;margin-top:36px;opacity:0;animation:fadeUp var(--dur-mid) 0.6s forwards}
.action-btn-icon{
  width:52px;height:52px;border-radius:50%;border:1px solid rgba(141,121,136,0.15);
  background:var(--bg-card);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all var(--dur-fast) var(--ease);color:var(--c-purple-light);
}
.action-btn-icon:active{transform:scale(0.9);border-color:var(--c-purple-light)}
.action-btn-icon svg{width:22px;height:22px}
.result-tomorrow{font-size:12px;color:var(--text-light);margin-top:20px;letter-spacing:1px;opacity:0;animation:fadeUp var(--dur-mid) 0.9s forwards;font-family:"PingFang SC","Noto Sans SC",sans-serif}

/* === PAGE: ALREADY DRAWN === */
#page-drawn{background:var(--bg-main);align-items:center;justify-content:center;padding:24px}
.drawn-star{margin-bottom:24px;opacity:0;animation:scaleIn var(--dur-mid) 0.2s forwards}
.drawn-star svg{width:40px;height:40px;opacity:0.5}
.drawn-tone-label{font-size:11px;color:var(--text-light);letter-spacing:2px;margin-bottom:8px;font-family:"PingFang SC","Noto Sans SC",sans-serif;opacity:0;animation:fadeIn var(--dur-mid) 0.3s forwards}
.drawn-title{font-size:22px;color:var(--text-main);margin-bottom:8px;letter-spacing:3px;opacity:0;animation:fadeUp var(--dur-mid) 0.4s forwards}
.drawn-text-sub{font-size:13px;color:var(--text-sub);margin-bottom:28px;letter-spacing:1px;opacity:0;animation:fadeUp var(--dur-mid) 0.5s forwards;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.drawn-preview{
  width:min(78vw,300px);border-radius:16px;padding:36px 28px;background:var(--bg-card);
  border:1px solid rgba(141,121,136,0.08);margin-bottom:28px;opacity:0;
  animation:fadeUp var(--dur-mid) 0.6s forwards;position:relative;
  box-shadow:0 8px 32px rgba(39,36,43,0.03);
}
.drawn-preview::before{content:'';position:absolute;top:12px;left:12px;right:12px;bottom:12px;border:1px solid rgba(141,121,136,0.06);border-radius:8px;pointer-events:none}
.drawn-preview-text{font-size:18px;line-height:2.2;color:var(--text-main);text-align:center;position:relative;z-index:1}
.drawn-preview-tone{display:flex;align-items:center;gap:6px;margin-top:20px;justify-content:center}
.drawn-preview-swatch{width:12px;height:12px;border-radius:50%}
.drawn-preview-name{font-size:11px;color:var(--text-light);letter-spacing:1px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.drawn-countdown{font-size:13px;color:var(--text-sub);letter-spacing:1px;margin-bottom:24px;opacity:0;animation:fadeUp var(--dur-mid) 0.8s forwards;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.drawn-action{padding:12px 32px;border-radius:24px;background:var(--c-purple-deep);color:#fff;border:none;font-size:14px;letter-spacing:2px;cursor:pointer;transition:all var(--dur-fast) var(--ease);font-family:"PingFang SC","Noto Sans SC",sans-serif;opacity:0;animation:fadeUp var(--dur-mid) 1s forwards}
.drawn-action:active{transform:scale(0.96);opacity:0.9}

/* === PAGE: COLLECTION (收藏页) === */
#page-collection{background:var(--bg-main);padding:0 24px}
.collection-head{padding:48px 0 24px;opacity:0;animation:fadeUp var(--dur-mid) 0.1s forwards}
.collection-title{font-size:28px;font-weight:600;letter-spacing:4px;color:var(--text-main)}
.collection-stats{font-size:13px;color:var(--text-sub);letter-spacing:1px;margin-top:6px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.collection-list{display:flex;flex-direction:column;gap:14px;padding-bottom:100px;opacity:0;animation:fadeUp var(--dur-mid) 0.3s forwards}
.collection-card{
  background:var(--bg-card);border-radius:16px;padding:22px 24px;
  border:1px solid rgba(141,121,136,0.06);position:relative;
  transition:all var(--dur-fast) var(--ease);cursor:pointer;
}
.collection-card:active{transform:scale(0.98)}
.collection-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.collection-card-date{font-size:11px;color:var(--text-light);letter-spacing:1px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.collection-card-tag{font-size:11px;padding:3px 12px;border-radius:12px;letter-spacing:1px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.collection-card-text{font-size:16px;line-height:1.9;color:var(--text-main)}
.collection-card-fav{position:absolute;bottom:18px;right:18px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--c-purple-light);opacity:0.6}
.collection-empty{text-align:center;color:var(--text-light);font-size:14px;line-height:2;padding:60px 20px;font-family:"PingFang SC","Noto Sans SC",sans-serif}

/* === TAB BAR === */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;height:64px;
  background:rgba(246,241,233,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(141,121,136,0.08);
  display:flex;align-items:center;justify-content:space-around;z-index:50;
}
.tab-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  border:none;background:none;cursor:pointer;color:var(--text-light);
  transition:color var(--dur-fast) var(--ease);padding:8px 20px;
}
.tab-item.active{color:var(--c-purple-deep)}
.tab-item svg{width:24px;height:24px}
.tab-item-label{font-size:10px;letter-spacing:1px;font-family:"PingFang SC","Noto Sans SC",sans-serif}

/* === SHARE OVERLAY === */
.share-overlay{position:fixed;inset:0;background:rgba(39,36,43,0.92);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column}
.share-overlay.show{display:flex;animation:fadeIn 0.3s ease}
.share-card-wrap{border-radius:16px;overflow:hidden}
.share-card-wrap canvas{display:block}
.share-hint{color:rgba(255,255,255,0.5);font-size:13px;margin-top:20px;letter-spacing:1px;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.share-close{margin-top:16px;font-size:14px;color:rgba(255,255,255,0.4);cursor:pointer;padding:8px 24px;border:1px solid rgba(255,255,255,0.1);border-radius:20px;font-family:"PingFang SC","Noto Sans SC",sans-serif}

/* === TOAST === */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bg-card);color:var(--text-main);font-size:14px;padding:10px 24px;border-radius:30px;z-index:200;opacity:0;transition:opacity var(--dur-fast);pointer-events:none;letter-spacing:1px;border:1px solid rgba(141,121,136,0.1);box-shadow:0 4px 16px rgba(39,36,43,0.06);font-family:"PingFang SC","Noto Sans SC",sans-serif}
.toast.show{opacity:1}

/* === RESPONSIVE === */
@media(max-width:360px){
  .mood-item{padding:16px 18px}
  .result-text{font-size:18px}
  .today-date-day{font-size:56px}
  .collection-title{font-size:24px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms !important;transition-duration:0.01ms !important}
}
</style>
</head>
<body>

<!-- Page: Today (首页) -->
<div class="page page-scroll" id="page-today">
  <div class="today-nav">
    <div class="today-nav-brand">好运签</div>
    <button class="today-nav-fav" onclick="goCollection()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>
  <div class="today-date">
    <div class="today-date-day" id="todayDay">08</div>
    <div class="today-date-meta" id="todayDateMeta">AUG.12 · WEDNESDAY</div>
  </div>
  <div class="today-note" onclick="scrollToTodayNote()">
    <div>
      <div class="today-note-label sans">TODAY'S NOTE</div>
      <div class="today-note-text">今天有一件事值得你对自己温柔一点。</div>
    </div>
    <span class="today-note-arrow">→</span>
  </div>
  <div class="today-prompt">今天想要哪一种好运？</div>
  <div class="mood-list" id="moodList">
    <!-- Generated by JS -->
  </div>
  <div style="height:100px"></div>
</div>

<!-- Page: Draw (抽签引导) -->
<div class="page" id="page-draw">
  <div class="draw-stars" id="drawStars"></div>
  <div class="draw-text" id="drawHint">把最近的一件事放在心里。</div>
  <div class="draw-star-center">
    <div class="star-rotate">
      <svg viewBox="0 0 60 60" fill="none">
        <path d="M30 6 L34 24 L52 28 L34 32 L30 50 L26 32 L8 28 L26 24 Z" fill="rgba(201,135,217,0.7)" stroke="rgba(201,135,217,0.3)" stroke-width="0.5"/>
      </svg>
    </div>
  </div>
  <div class="draw-dots">
    <div class="draw-dot"></div>
    <div class="draw-dot"></div>
    <div class="draw-dot"></div>
  </div>
  <div class="draw-prompt" id="drawPrompt" onclick="proceedToCard()">准备好了吗？</div>
  <div class="draw-card-stage" id="drawCardStage" style="display:none">
    <div class="draw-card-3d" id="drawCard3d">

{id:"s01",cat:"soothe",text:"你今天觉得累，不是因为你不够好，是你一个人扛了太多。放下也没关系的。",timeType:"none",tags:["累","扛","放下"]},

{id:"s20",cat:"soothe",text:"你今天已经够努力了。不是每件事都要看到结果才算数，种子在地下的日子也算。",timeType:"today",tags:["努力","种子","地下"]},

{id:"s27",cat:"soothe",text:"你今天硬撑过去的那一刻，没看到你在哭，但我看到了。你很了不起。",timeType:"today",tags:["硬撑","哭","了不起"]},

{id:"s36",cat:"soothe",text:"你今天不想说话就不说。沉默也是一种回答，懂你的人自然懂。",timeType:"today",tags:["不说话","沉默","懂"]},
{id:"s37",cat:"soothe",text:"你不是没有方向，你只是走了太多的弯路。但弯路上也有风景，不是吗。",timeType:"none",tags:["方向","弯路","风景"]},

{id:"s41",cat:"soothe",text:"你觉得孤独，但孤独不是因为你不好，是因为你和周围还不够合拍。换个人群就好了。",timeType:"none",tags:["孤独","合拍","换"]},
{id:"s42",cat:"soothe",text:"你今天流的泪，其实在帮你排毒。身体比你更爱你，它不会让你白哭的。",timeType:"today",tags:["泪","排毒","身体"]},
{id:"s43",cat:"soothe",text:"你不是在原地踏步，你是在给后面的冲刺攒脚劲。蹲下才能跳得更高。",timeType:"none",tags:["踏步","蹲","跳"]},
{id:"s44",cat:"soothe",text:"你最近总是觉得累，可能是因为你在长大。蜕壳的蝉也很累，但它在变强。",timeType:"none",tags:["累","长大","蜕壳"]},

{id:"s49",cat:"soothe",text:"你害怕被遗忘，但你做过的好事、说过的好话，都种在了别人心里。它们记得。",timeType:"none",tags:["遗忘","好事","记得"]},
{id:"s50",cat:"soothe",text:"你今天活下来了。对于某些人来说，这就已经是英雄主义了。别小看这件事。",timeType:"today",tags:["活下来","英雄","小看"]},

{id:"h26",cat:"heal",text:"你觉得自己不够特别，但你笑起来的时候，世界上没有第二个人能复制那个弧度。",timeType:"none",tags:["不特别","笑","弧度"]},
{id:"h27",cat:"heal",text:"你藏起来的那些脆弱，不是你的污点，是你的年轮。没有它们你长不到现在。",timeType:"none",tags:["脆弱","年轮","长"]},
{id:"h28",cat:"heal",text:"今天允许自己做一个普通的人。不精彩的今天也是今天，也值得过。",timeType:"today",tags:["普通","精彩","值得"]},
{id:"h29",cat:"heal",text:"你以为自己在逞强，但知道你事情的人，心里都在替你心疼。你有没有心疼过自己？",timeType:"none",tags:["逞强","心疼","自己"]},
{id:"h30",cat:"heal",text:"你不需要证明自己值得被爱。你呼吸着，你存在着，这件事本身就已经够了。",timeType:"none",tags:["证明","值得","呼吸"]},
{id:"h31",cat:"heal",text:"你今天觉得世界灰灰的，可能只是该喝水了。先去喝口水再继续难过吧。",timeType:"today",tags:["灰","喝水","难过"]},
{id:"h32",cat:"heal",text:"你以为自己没被在意，但你每次缺席都有人注意到了。只是他们没说。",timeType:"none",tags:["没在意","缺席","注意到"]},
{id:"h33",cat:"heal",text:'你不用把所有的"我没事"都变成"我很好"。有时候"我还活着"就足够了。',timeType:"none",tags:["没事","很好","活着"]},
{id:"h34",cat:"heal",text:"你觉得失去的东西回不来了，但你腾出来的那个位置，会迎来更好的东西。",timeType:"none",tags:["失去","腾","更好"]},
{id:"h35",cat:"heal",text:"你今天不必做任何决定。有些日子就是用来发呆的，明天再说也来得及。",timeType:"today",tags:["决定","发呆","明天"]},
{id:"h36",cat:"heal",text:"你总是怕麻烦别人，但你想想，你帮别人的时候有没有嫌烦过？给别人一次被你需要的快乐吧。",timeType:"none",tags:["麻烦","帮","需要"]},
{id:"h37",cat:"heal",text:"你觉得世界很大自己很小，但蝴蝶扇一下翅膀就能引起风暴。你不小的。",timeType:"none",tags:["大","小","蝴蝶"]},
{id:"h38",cat:"heal",text:"你今天皱眉的次数有点多了。试着松一下眉心，你的身体会谢谢你的。",timeType:"today",tags:["皱眉","松","眉心"]},
{id:"h39",cat:"heal",text:"你以为自己在迷失，其实你只是在走一条没有路标的路。走的人多了就成了路。",timeType:"none",tags:["迷失","路标","路"]},
{id:"h40",cat:"heal",text:"你不需要治愈好所有伤口才能开始生活。带着伤往前走，也是一种勇敢。",timeType:"none",tags:["治愈","伤口","勇敢"]},
{id:"h41",cat:"heal",text:"你觉得自己的努力没有回报，但有些回报在路上走得慢一点。它是赶着来的。",timeType:"none",tags:["回报","路上","赶"]},
{id:"h42",cat:"heal",text:"今天可以吃点好的。不是因为今天特别，是因为你值得每天都吃点好的。",timeType:"today",tags:["吃好","值得","每天"]},
{id:"h43",cat:"heal",text:"你总是在深夜emo，但你有没有想过，深夜的你才是最真实的你。她需要被你抱一抱。",timeType:"none",tags:["深夜","真实","抱"]},
{id:"h44",cat:"heal",text:"你以为自己不配拥有好东西，但好东西不是靠配不配，是靠你伸手去拿。",timeType:"none",tags:["不配","好东西","伸手"]},
{id:"h45",cat:"heal",text:"你今天对别人笑了几次，也对自己笑一次吧。你也需要被你自己温柔以待。",timeType:"today",tags:["笑","自己","温柔"]},
{id:"h46",cat:"heal",text:"你觉得日子重复而乏味，但每天太阳都是新的。今天的光和昨天的不一样。",timeType:"none",tags:["重复","太阳","新"]},
{id:"h47",cat:"heal",text:"你不需要等别人来给你安全感。你给自己的，才是别人拿不走的。",timeType:"none",tags:["安全感","给","拿不走"]},
{id:"h48",cat:"heal",text:"你觉得没有人在听你说话，但你说的每一句好话，都被空气记住了。它会传出去的。",timeType:"none",tags:["没人听","空气","传"]},
{id:"h49",cat:"heal",text:"今天可以早点上床。不是要你早睡，是让你多躺一会儿。你的身体需要被躺平。",timeType:"today",tags:["上床","早睡","躺"]},
{id:"h50",cat:"heal",text:"你以为自己在泥里，但莲花也长在泥里。泥不是你的敌人，是你的培养基。",timeType:"none",tags:["泥","莲花","培养"]},

// ========== 打气类 (50条) ==========
{id:"c01",cat:"cheer",text:"你不需要证明给所有人看。真正重要的人，从来没要求过你证明什么。",timeType:"none",tags:["证明","重要","要求"]},
{id:"c02",cat:"cheer",text:"你现在走的路很难，但难的路才通向值得去的地方。你选对了。",timeType:"none",tags:["难","路","值得"]},
{id:"c03",cat:"cheer",text:"他们看不到你的努力，但你的努力不会白费。它正在你看不见的地方长根。",timeType:"none",tags:["看不到","努力","长根"]},
{id:"c04",cat:"cheer",text:"今天会有人因为你的存在而觉得幸运。你只是还不知道是谁。",timeType:"today",tags:["存在","幸运","谁"]},
{id:"c05",cat:"cheer",text:"你犹豫的那件事，做就对了。怕的从来不是结果，是你迟迟不敢开始。",timeType:"none",tags:["犹豫","怕","开始"]},
{id:"c06",cat:"cheer",text:"你比昨天又强了一点点。虽然你看不见，但你的骨头知道。",timeType:"none",tags:["昨天","强","骨头"]},
{id:"c07",cat:"cheer",text:"他们说你不行，但说这话的人，从来没走到过你现在站的位置。",timeType:"none",tags:["不行","说","位置"]},
{id:"c08",cat:"cheer",text:"你现在的状态像竹子，前四年只长三厘米，第五年开始每天长三十厘米。你在第四年。",timeType:"none",tags:["竹子","厘米","第四年"]},
{id:"c09",cat:"cheer",text:"你不需要赢过所有人，你只需要赢过昨天的自己。她不难超越的，因为她也想让你赢。",timeType:"none",tags:["赢","昨天","超越"]},
{id:"c10",cat:"cheer",text:"你现在觉得被否定，但被否定不是因为你差，是因为你走到了没人否定过的高度。",timeType:"none",tags:["否定","高度","差"]},
{id:"c11",cat:"cheer",text:"你害怕的失败，其实只是成功在试你的诚意。你是认真的，它就会来。",timeType:"none",tags:["失败","诚意","来"]},
{id:"c12",cat:"cheer",text:"你今天的咬牙坚持，不会被辜负的。命运可能晚到，但它不瞎。",timeType:"today",tags:["咬牙","坚持","命运"]},
{id:"c13",cat:"cheer",text:"你不是没有天赋，你只是还没找到需要你的那个赛道。找赛道比跑赛道更重要。",timeType:"none",tags:["天赋","赛道","找"]},
{id:"c14",cat:"cheer",text:"你觉得自己被低估了，那就让低估成为你的燃料。安静地烧，猛烈地飞。",timeType:"none",tags:["低估","燃料","飞"]},
{id:"c15",cat:"cheer",text:"你现在做的那件没人理解的事，以后会是你最骄傲的决定。信我。",timeType:"none",tags:["没人理解","骄傲","决定"]},
{id:"c16",cat:"cheer",text:"你不需要等待时机成熟。时机永远不会自己成熟，是你走出去了它才熟。",timeType:"none",tags:["等待","时机","走出去"]},
{id:"c17",cat:"cheer",text:"你犹豫要不要发出去的那条消息，发吧。不发的遗憾比发了的尴尬更重。",timeType:"none",tags:["发消息","遗憾","尴尬"]},
{id:"c18",cat:"cheer",text:"你害怕自己不够格，但你已经被放在这个位置上了。说明有人看到了你。",timeType:"none",tags:["不够格","位置","看到"]},
{id:"c19",cat:"cheer",text:"你觉得别人都在发光，只有你在阴影里。但阴影里的人最适合观察，你下一个出场会惊艳。",timeType:"none",tags:["发光","阴影","出场"]},
{id:"c20",cat:"cheer",text:"你今天的疲惫是勋章，不是负担。你把它戴上了，就别嫌它沉。",timeType:"today",tags:["疲惫","勋章","沉"]},
{id:"c21",cat:"cheer",text:"你不是在浪费青春，你是在用它换一个更硬的自己。这买卖不亏。",timeType:"none",tags:["浪费","青春","换"]},
{id:"c22",cat:"cheer",text:"你现在觉得什么都没有，但你有一双手、一颗心和一个明天。原始人的起步比你还少。",timeType:"none",tags:["什么都没有","手","明天"]},
{id:"c23",cat:"cheer",text:"你不需要所有人都喜欢你。你只需要几个真心的，和一个不放弃的自己。",timeType:"none",tags:["喜欢","真心","不放弃"]},
{id:"c24",cat:"cheer",text:"你觉得自己走错了路，但地球是圆的，走错了也能到。只要你不停下。",timeType:"none",tags:["错","圆","不停"]},
{id:"c25",cat:"cheer",text:"你害怕来不及，但你的时区和别人不一样。有人在25岁绽放，有人在45岁开花。",timeType:"none",tags:["来不及","时区","开花"]},
{id:"c26",cat:"cheer",text:"你今天不想动了也得动一下。不是因为今天重要，是因为你怕的不是动作，是开始。",timeType:"today",tags:["不动","开始","动作"]},
{id:"c27",cat:"cheer",text:"你觉得天花板很低，但天花板是用来打破的，不是用来低头的。",timeType:"none",tags:["天花板","打破","低头"]},
{id:"c28",cat:"cheer",text:"你不是没有资源，你是有你自己。有些人连这个都没有。",timeType:"none",tags:["资源","自己","没有"]},
{id:"c29",cat:"cheer",text:"你想了太多但做了太少。今天做一个小动作就够了，哪怕只是打开文档。",timeType:"today",tags:["想","做","小动作"]},
{id:"c30",cat:"cheer",text:"你觉得被时代抛下了，但时代是螺旋上升的。你在下面不代表你在退，你在打底座。",timeType:"none",tags:["抛下","螺旋","底座"]},
{id:"c31",cat:"cheer",text:"你不需要等别人认可了再行动。认可是在行动之后来的，不是之前。",timeType:"none",tags:["认可","行动","之后"]},
{id:"c32",cat:"cheer",text:"你今天的每一个选择都在写故事。有些篇章写得不好没关系，后面还有翻盘的章节。",timeType:"today",tags:["选择","故事","翻盘"]},
{id:"c33",cat:"cheer",text:"你觉得被比较很烦，但能被拿来比较说明你在同一个赛道上了。你已经赢了很多人。",timeType:"none",tags:["比较","赛道","赢"]},
{id:"c34",cat:"cheer",text:"你不需要害怕被看到。被看到是好事，说明你身上的光已经藏不住了。",timeType:"none",tags:["害怕","看到","光"]},
{id:"c35",cat:"cheer",text:"你觉得自己没有竞争力，但你的独特经历是任何人复制不了的。那就是你的护城河。",timeType:"none",tags:["竞争力","经历","护城河"]},
{id:"c36",cat:"cheer",text:"你今天想要放弃的时候，再数三秒。三秒过后你可能会发现还撑得住。",timeType:"today",tags:["放弃","三秒","撑"]},
{id:"c37",cat:"cheer",text:"你觉得别人起点高，但你忘了他们也有他们的天花板。你已经从地下室爬到一楼了。",timeType:"none",tags:["起点","天花板","爬"]},
{id:"c38",cat:"cheer",text:"你不需要一个完美计划才开始。乱开局也比不开局强，路上修方向就行。",timeType:"none",tags:["完美","计划","路上"]},
{id:"c39",cat:"cheer",text:"你害怕被拒绝，但被拒绝是筛选。拒掉你的不是你的路，真正属于你的路不会拒你。",timeType:"none",tags:["拒绝","筛选","路"]},
{id:"c40",cat:"cheer",text:"你觉得自己在假努力，但假努力也是努力。先把量堆上，质会自己来找你的。",timeType:"none",tags:["假努力","量","质"]},
{id:"c41",cat:"cheer",text:"你今天没崩就赢了。有的人今天崩了，你没崩，你赢了一天。明天继续。",timeType:"today",tags:["崩","赢","明天"]},
{id:"c42",cat:"cheer",text:"你觉得前路迷茫，但雾里开车也能到终点。不需要看清全程，只需要看清前面十米。",timeType:"none",tags:["迷茫","雾","十米"]},
{id:"c43",cat:"cheer",text:"你不需要回头确认走了多远。脚印会留在后面，你只需要往前看。",timeType:"none",tags:["回头","脚印","往前"]},
{id:"c44",cat:"cheer",text:"你觉得自己的努力像水滴石穿看不到效果，但水滴从第二天就在石面上留痕了。只是你没俯身看。",timeType:"none",tags:["水滴","石穿","痕"]},
{id:"c45",cat:"cheer",text:'你今天可以小声跟自己说一句"我在变强"。不用很大声，你的骨头听得见。',timeType:"today",tags:["变强","骨头","听得见"]},
{id:"c46",cat:"cheer",text:"你不是在赌博，你是在投资自己。投资的回报周期更长，但它更稳。",timeType:"none",tags:["赌","投资","回报"]},
{id:"c47",cat:"cheer",text:"你觉得别人都好优秀，但他们在你看不到的地方也在偷偷崩溃。你看到的都是高光剪辑。",timeType:"none",tags:["优秀","崩溃","剪辑"]},
{id:"c48",cat:"cheer",text:"你不需要一步到位。半步半步走也行，只要方向是对的，慢就是快。",timeType:"none",tags:["一步","半步","快"]},
{id:"c49",cat:"cheer",text:"你今天害怕做错选择，但做错也比不做好。不做的遗憾是永久的，做错的后悔是暂时的。",timeType:"today",tags:["做错","不做","遗憾"]},
{id:"c50",cat:"cheer",text:"你觉得自己的故事不够精彩，但精彩的故事都需要一个不够精彩的开始。你就是序章。",timeType:"none",tags:["精彩","开始","序章"]},

// ========== 指路类 (50条) ==========
{id:"g01",cat:"guide",text:"你纠结选哪条路，其实两条都通向同一个你。只是风景不同，没有对错。",timeType:"none",tags:["纠结","路","风景"]},
{id:"g02",cat:"guide",text:"如果不知道选什么，就选让你害怕但心跳加快的那个。那通常是正确答案。",timeType:"none",tags:["害怕","心跳","正确"]},
{id:"g03",cat:"guide",text:"你等的那个答案，不是没来，是还在路上。它走得很慢，但它在走。",timeType:"none",tags:["答案","路上","走"]},
{id:"g04",cat:"guide",text:"你反复想起的那件事，就是心里已经选好的答案。你只是在等自己接受。",timeType:"none",tags:["反复","答案","接受"]},
{id:"g05",cat:"guide",text:"没有白走的路。绕远的那些，都是在教会你一些直路上学不到的东西。",timeType:"none",tags:["白走","绕远","教"]},
{id:"g06",cat:"guide",text:"如果今天什么都想不清楚，就先睡觉。明天醒来的你，比现在清醒。",timeType:"today",tags:["想不清","睡觉","清醒"]},
{id:"g07",cat:"guide",text:"你现在觉得卡住了，但卡住是转弯的前奏。河流到了弯道也会慢下来。",timeType:"none",tags:["卡住","转弯","河流"]},
{id:"g08",cat:"guide",text:"你不需要看清整条路才迈步。看清前面的三米就够了，走过去自然能看到下三米。",timeType:"none",tags:["看清","三米","走"]},
{id:"g09",cat:"guide",text:"如果在两个选择之间犹豫，说明它们差不多。那随便选一个就好，走起来再说。",timeType:"none",tags:["犹豫","差不多","选"]},
{id:"g10",cat:"guide",text:"你觉得自己在等一个信号，但信号就是你开始做了以后才出现的。不是先有信号。",timeType:"none",tags:["信号","做","先有"]},
{id:"g11",cat:"guide",text:"如果你反复梦见同一件事，那不是潜意识在折磨你，是它想让你看见你自己。",timeType:"none",tags:["梦见","潜意识","看见"]},
{id:"g12",cat:"guide",text:"你等的那个人不会来了，但你不是在白等，你是在等的过程中长出了翅膀。往后自己飞。",timeType:"none",tags:["等","翅膀","飞"]},
{id:"g13",cat:"guide",text:"如果你不知道自己想要什么，先排除不想要的。剩下的就是可能想要的。",timeType:"none",tags:["想要","排除","可能"]},
{id:"g14",cat:"guide",text:"你觉得方向错了，但错了也是信息。至少你知道了这条路不通，下条就不试了。",timeType:"none",tags:["错","信息","不通"]},
{id:"g15",cat:"guide",text:"你现在停下了不代表放弃了。有时候停下来看看地图，比闷头跑更高效。",timeType:"none",tags:["停","放弃","地图"]},
{id:"g16",cat:"guide",text:"如果你最近常想起过去的事，不是你走不出来，是你到了回头看才看得清的距离。",timeType:"none",tags:["过去","回头看","距离"]},
{id:"g17",cat:"guide",text:"你害怕选错，但错和对你不是对立的。有些路走到头才知道它是对是错，走到一半判断不了。",timeType:"none",tags:["错","对","走到头"]},
{id:"g18",cat:"guide",text:"如果你觉得该离开了，那就是该离开了。你的直觉比你以为的准。",timeType:"none",tags:["离开","直觉","准"]},
{id:"g19",cat:"guide",text:"你觉得自己一直在准备但从没出发，可能准备本身就是你在逃避的借口。出发吧。",timeType:"none",tags:["准备","出发","借口"]},
{id:"g20",cat:"guide",text:"如果你反复问别人同一件事，其实你心里有答案了，只是想要一个人替你说出来。",timeType:"none",tags:["问","答案","说出来"]},
{id:"g21",cat:"guide",text:"你纠结的不是选什么，是怕选了以后后悔。但后悔也是一种体验，不亏。",timeType:"none",tags:["纠结","后悔","体验"]},
{id:"g22",cat:"guide",text:"如果你现在觉得人生没有方向，可能方向不是一个点，是你走着走着长出来的。",timeType:"none",tags:["方向","走","长出来"]},
{id:"g23",cat:"guide",text:"你等的外部条件永远不会全部成熟。条件是你走着走着自己创造的。",timeType:"none",tags:["条件","等","创造"]},
{id:"g24",cat:"guide",text:"你觉得在跟世界较劲，其实你在跟自己较劲。世界没那么在意你选什么，是你自己太较真了。",timeType:"none",tags:["较劲","世界","自己"]},
{id:"g25",cat:"guide",text:"如果你不知道该做什么，就先把自己照顾好。方向会来找你的，在你状态好的时候。",timeType:"none",tags:["做什么","照顾","方向"]},
{id:"g26",cat:"guide",text:"你反复纠结的那段关系，其实你纠结的不是对方好不好，是你舍不舍得放手。",timeType:"none",tags:["纠结","关系","放手"]},
{id:"g27",cat:"guide",text:"如果你觉得自己不属于现在的圈子，那就是不属于。离开不叫背叛，叫找到自己。",timeType:"none",tags:["圈子","离开","找到"]},
{id:"g28",cat:"guide",text:"你等一个转机，但转机不是一个事件，是一个你突然想通了的瞬间。那个瞬间你自己造的。",timeType:"none",tags:["转机","想通","造"]},
{id:"g29",cat:"guide",text:"你觉得自己在原地转圈，但如果螺旋上升也是转圈呢。你只是看不到高度差。",timeType:"none",tags:["转圈","螺旋","高度"]},

// --- Lucky colors (7 options) ---
const LUCKY_COLORS = ['#8D7988','#66567F','#E8A39C','#E8D69A','#6BC3A1','#7DA2E6','#C987D9'];
const LUCKY_COLOR_NAMES = ['# 8D7988','# 66567F','# E8A39C','# E8D69A','# 6BC3A1','# 7DA2E6','# C987D9'];

function getDailyLuckyColor() {
  var d = new Date();
  var dayIdx = (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % LUCKY_COLORS.length;
  return { color: LUCKY_COLORS[dayIdx], name: LUCKY_COLOR_NAMES[dayIdx] };
}

// --- Storage helpers ---
function getTodayKey(){
  var d=new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function getDrawHistory(){
  try{return JSON.parse(localStorage.getItem('fortune_history')||'[]')}catch(e){return[]}
}
function saveDrawHistory(h){localStorage.setItem('fortune_history',JSON.stringify(h))}
function getTodayDraw(){
  var h=getDrawHistory();
  return h.find(function(x){return x.dateKey===todayKey});
}
function getDrawnIds(){
  return getDrawHistory().map(function(x){return x.id});
}
function getLastDrawTags(){
  var h=getDrawHistory();
  if(h.length===0)return[];
  return h[h.length-1].tags||[];
}
function getStreak(){
  var h=getDrawHistory();
  if(h.length===0)return 0;
  var streak=0;
  var today=new Date();
  for(var i=0;i<h.length;i++){
    var d=new Date(today.getTime()-i*86400000);
    var key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    if(h.some(function(x){return x.dateKey===key}))streak++;
    else break;
  }
  return streak;
}

// --- Smart draw algorithm (same as original) ---
function drawSlip(category){
  var dayOfWeek=new Date().getDay();
  var drawnIds=getDrawnIds();
  var lastTags=getLastDrawTags();

  var pool=TEXTS.filter(function(t){
    if(t.cat!==category)return false;
    if(t.availableDays&&!t.availableDays.includes(dayOfWeek))return false;
    if(drawnIds.includes(t.id))return false;
    return true;
  });

  if(pool.length===0){
    pool=TEXTS.filter(function(t){
      if(t.cat!==category)return false;
      if(t.availableDays&&!t.availableDays.includes(dayOfWeek))return false;
      return true;
    });
  }

  if(lastTags.length>0&&pool.length>3){
    var filtered=pool.filter(function(t){
      if(!t.tags)return true;
      var overlap=t.tags.filter(function(tag){return lastTags.includes(tag)});
      var ratio=overlap.length/Math.max(t.tags.length,1);
      return ratio<0.5;
    });
    if(filtered.length>=3)pool=filtered;
  }

  return pool[Math.floor(Math.random()*pool.length)];
}

// --- Page navigation ---
function showPage(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.getElementById(id).classList.add('active');
  // Tab bar visibility
  var tabbar = document.getElementById('tabbar');
  var showTabs = (id==='page-today' || id==='page-collection' || id==='page-drawn');
  tabbar.style.display = showTabs ? 'flex' : 'none';
  // Tab highlight
  document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});
  if(id==='page-today' || id==='page-drawn') document.getElementById('tab-today').classList.add('active');
  if(id==='page-collection') document.getElementById('tab-collection').classList.add('active');
}

// --- Mood selection ---
function selectMood(oldCat){
  currentMood = oldCat;
  var existing = getTodayDraw();
  if(existing){
    showTodayDrawn(existing);
  } else {
    showPage('page-draw');
    // Reset draw page state
    document.getElementById('drawCardStage').style.display = 'none';
    document.getElementById('drawPrompt').style.display = '';
    document.getElementById('drawHint').style.display = '';
    document.querySelector('.draw-star-center').style.display = '';
    document.querySelector('.draw-dots').style.display = '';
  }
}

// --- Proceed to card from draw prompt ---
function proceedToCard(){
  document.getElementById('drawPrompt').style.display = 'none';
  document.getElementById('drawHint').style.display = 'none';
  document.querySelector('.draw-star-center').style.display = 'none';
  document.querySelector('.draw-dots').style.display = 'none';
  document.getElementById('drawCardStage').style.display = '';
  // Reset card
  document.getElementById('drawCard3d').classList.remove('flipped');
  document.getElementById('drawCardStage').classList.remove('flipping');
}

// --- Card flip ---
function flipCard(){
  var stage = document.getElementById('drawCardStage');
  var card = document.getElementById('drawCard3d');
  if(card.classList.contains('flipped')) return;

  currentSlip = drawSlip(currentMood);
  document.getElementById('drawCardText').textContent = currentSlip.text;
  var now = new Date();
  document.getElementById('drawCardDate').textContent = (now.getMonth()+1) + ' / ' + now.getDate();

  stage.classList.add('flipping');
  card.classList.add('flipped');

  setTimeout(function(){
    showResult();
    stage.classList.remove('flipping');
  }, 2200);
}

// --- Show result ---
function showResult(){
  var now = new Date();
  var newCat = mapCat(currentMood);
  var cat = CATS_NEW[newCat];
  var lucky = getDailyLuckyColor();

  document.getElementById('resultText').textContent = currentSlip.text;
  document.getElementById('resultDate').textContent = String(now.getMonth()+1).padStart(2,'0') + ' / ' + String(now.getDate()).padStart(2,'0');
  document.getElementById('resultSub').textContent = cat.sub;

  // Lucky tone color
  document.getElementById('resultToneSwatch').style.background = lucky.color;
  document.getElementById('resultToneName').textContent = lucky.name;

  // Card border tone
  var card = document.getElementById('resultCard');
  card.style.borderColor = cat.accent + '20';
  card.style.boxShadow = '0 8px 40px ' + cat.accent + '08';

  // Save to history
  var history = getDrawHistory();
  history.push({
    id: currentSlip.id,
    dateKey: todayKey,
    dateStr: (now.getMonth()+1)+'/'+now.getDate(),
    cat: currentMood,
    newCat: newCat,
    text: currentSlip.text,
    tags: currentSlip.tags || [],
    luckyColor: lucky.color,
    luckyName: lucky.name
  });
  saveDrawHistory(history);

  updateTomorrowCountdown();
  showPage('page-result');
}

// --- Tomorrow countdown ---
function updateTomorrowCountdown(){
  var el = document.getElementById('tomorrowText');
  function tick(){
    var now = new Date();
    var tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate()+1);
    tomorrow.setHours(0,0,0,0);
    var diff = tomorrow - now;
    var h = Math.floor(diff/3600000);
    var m = Math.floor((diff%3600000)/60000);
    var s = Math.floor((diff%60000)/1000);
    el.textContent = '距离明天的好运还有 ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  tick();
  clearInterval(window._countdownTimer);
  window._countdownTimer = setInterval(tick, 1000);
}

// --- Show already drawn ---
function showTodayDrawn(drawn){
  var newCat = mapCat(drawn.cat);
  var cat = CATS_NEW[newCat];
  var lucky = drawn.luckyColor ? {color:drawn.luckyColor, name:drawn.luckyName} : getDailyLuckyColor();

  document.getElementById('drawnPreviewText').textContent = drawn.text;
  document.getElementById('drawnPreviewSwatch').style.background = lucky.color;
  document.getElementById('drawnPreviewName').textContent = lucky.name;

  function tick(){
    var now = new Date();
    var tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate()+1);
    tomorrow.setHours(0,0,0,0);
    var diff = tomorrow - now;
    var h = Math.floor(diff/3600000);
    var m = Math.floor((diff%3600000)/60000);
    var s = Math.floor((diff%60000)/1000);
    document.getElementById('drawnCountdown').textContent = '距离明天的好运还有 ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  tick();
  clearInterval(window._countdownTimer);
  window._countdownTimer = setInterval(tick, 1000);

  showPage('page-drawn');
}

// --- Collection page ---
function renderCollection(){
  var history = getDrawHistory();
  var stats = document.getElementById('collectionStats');
  var list = document.getElementById('collectionList');

  stats.textContent = history.length + '句值得留下的话';

  if(history.length === 0){
    list.innerHTML = '<div class="collection-empty">还没有收藏<br>抽一签，把值得留下的话存起来</div>';
    return;
  }

  var html = '';
  history.slice().reverse().forEach(function(h){
    var newCat = mapCat(h.cat);
    var cat = CATS_NEW[newCat];
    var lucky = h.luckyColor || '#C987D9';
    html += '<div class="collection-card" onclick="viewHistoryItem(\''+h.id+'\')">'+
      '<div class="collection-card-top">'+
        '<span class="collection-card-date">'+(h.dateStr||'')+'</span>'+
        '<span class="collection-card-tag" style="background:'+cat.tagBg+';color:'+cat.accent+'">'+cat.label+'</span>'+
      '</div>'+
      '<div class="collection-card-text">'+h.text+'</div>'+
      '<div class="collection-card-fav">'+
        '<svg viewBox="0 0 24 24" fill="'+lucky+'" stroke="none" width="20" height="20"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'+
      '</div>'+
    '</div>';
  });
  list.innerHTML = html;
}

function viewHistoryItem(id){
  var h = getDrawHistory().find(function(x){return x.id===id});
  if(!h) return;
  var newCat = mapCat(h.cat);
  var cat = CATS_NEW[newCat];
  var lucky = h.luckyColor ? {color:h.luckyColor, name:h.luckyName} : getDailyLuckyColor();

  document.getElementById('resultText').textContent = h.text;
  var parts = (h.dateStr||'').match(/(\d+)\/(\d+)/);
  if(parts) document.getElementById('resultDate').textContent = parts[1].padStart(2,'0') + ' / ' + parts[2].padStart(2,'0');
  document.getElementById('resultSub').textContent = cat.sub;
  document.getElementById('resultToneSwatch').style.background = lucky.color;
  document.getElementById('resultToneName').textContent = lucky.name;
  document.getElementById('tomorrowText').textContent = '';
  showPage('page-result');
}

// --- Save card as image ---
function saveCard(){
  var card = document.getElementById('resultCard');
  var now = new Date();
  var dateStr = String(now.getMonth()+1).padStart(2,'0') + ' / ' + String(now.getDate()).padStart(2,'0');
  var textContent = document.getElementById('resultText').textContent;
  var subContent = document.getElementById('resultSub').textContent;
  var luckyColor = document.getElementById('resultToneSwatch').style.background;
  var luckyName = document.getElementById('resultToneName').textContent;

  showToast('正在生成图片...');

  var shareEl = document.createElement('div');
  shareEl.style.cssText = 'position:fixed;left:-9999px;top:0;width:360px;padding:44px 32px 36px;border-radius:16px;background:#FFFCF6;display:flex;flex-direction:column;align-items:center;min-height:460px;box-shadow:0 0 0 1px rgba(141,121,136,0.06),0 4px 24px rgba(39,36,43,0.04);font-family:"Songti SC","SimSun","Noto Serif SC",serif';

  // Star logo
  var starWrap = document.createElement('div');
  starWrap.style.cssText = 'margin-bottom:20px';
  starWrap.innerHTML = '<svg width="32" height="32" viewBox="0 0 40 40" fill="none"><path d="M20 4 L22 16 L34 18 L22 20 L20 32 L18 20 L6 18 L18 16 Z" fill="rgba(141,121,136,0.25)"/></svg>';
  shareEl.appendChild(starWrap);

  // Date
  var dateEl = document.createElement('div');
  dateEl.style.cssText = 'font-size:14px;color:#8D7988;letter-spacing:2px;margin-bottom:20px;font-family:"PingFang SC","Noto Sans SC",sans-serif';
  dateEl.textContent = dateStr;
  shareEl.appendChild(dateEl);

  // Divider
  var div1 = document.createElement('div');
  div1.style.cssText = 'width:32px;height:1px;background:#8D7988;opacity:0.3;margin-bottom:28px';
  shareEl.appendChild(div1);

  // Main text
  var textEl = document.createElement('div');
  textEl.style.cssText = 'font-size:20px;font-weight:400;line-height:2.2;color:#27242B;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;max-width:280px';
  textEl.textContent = textContent;
  shareEl.appendChild(textEl);

  // Sub text
  if(subContent){
    var subEl = document.createElement('div');
    subEl.style.cssText = 'font-size:13px;color:#8D7988;margin-top:16px;text-align:center;line-height:1.6;font-family:"PingFang SC","Noto Sans SC",sans-serif';
    subEl.textContent = subContent;
    shareEl.appendChild(subEl);
  }

  // Lucky tone
  var toneWrap = document.createElement('div');
  toneWrap.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:28px';
  toneWrap.innerHTML = '<div style="width:14px;height:14px;border-radius:50%;background:'+luckyColor+'"></div><span style="font-size:12px;color:#8D7988;font-family:PingFang SC,Noto Sans SC,sans-serif">'+luckyName+'</span>';
  shareEl.appendChild(toneWrap);

  // Bottom label
  var toneLabel = document.createElement('div');
  toneLabel.style.cssText = 'font-size:11px;color:#B0A8B0;letter-spacing:2px;margin-top:6px;font-family:"PingFang SC","Noto Sans SC",sans-serif';
  toneLabel.textContent = "TODAY'S LUCKY TONE";
  shareEl.appendChild(toneLabel);

  // Footer
  var footer = document.createElement('div');
  footer.style.cssText = 'display:flex;justify-content:space-between;width:100%;margin-top:32px;align-items:center';
  footer.innerHTML = '<span style="font-size:13px;color:#8D7988;letter-spacing:3px;font-family:PingFang SC,Noto Sans SC,sans-serif">好运签 GOOD LUCK TODAY.</span>';
  var star2 = document.createElement('span');
  star2.innerHTML = '<svg width="12" height="12" viewBox="0 0 20 20" fill="none"><path d="M10 2 L11 8 L17 9 L11 10 L10 16 L9 10 L3 9 L9 8 Z" fill="rgba(141,121,136,0.3)"/></svg>';
  footer.appendChild(star2);
  shareEl.appendChild(footer);

  document.body.appendChild(shareEl);

  html2canvas(shareEl, {
    scale: 2,
    backgroundColor: '#FFFCF6',
    useCORS: true,
    logging: false
  }).then(function(canvas){
    document.body.removeChild(shareEl);
    var wrap = document.getElementById('shareCardWrap');
    wrap.innerHTML = '';
    var maxW = Math.min(window.innerWidth - 48, 360);
    var scale = maxW / canvas.width;
    var displayCanvas = document.createElement('canvas');
    displayCanvas.width = canvas.width * scale;
    displayCanvas.height = canvas.height * scale;
    var ctx = displayCanvas.getContext('2d');
    ctx.drawImage(canvas, 0, 0, displayCanvas.width, displayCanvas.height);
    displayCanvas.style.borderRadius = '16px';
    displayCanvas.style.boxShadow = '0 4px 24px rgba(0,0,0,0.08)';
    wrap.appendChild(displayCanvas);
    document.getElementById('shareOverlay').classList.add('show');
    showToast('长按图片保存到相册');
  }).catch(function(){
    document.body.removeChild(shareEl);
    showToast('保存失败，请截图分享');
  });
}

function closeShare(){
  document.getElementById('shareOverlay').classList.remove('show');
}

// --- Toast ---
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){t.classList.remove('show')}, 2500);
}

// --- Generate random stars for draw page ---
function genStars(){
  var container = document.getElementById('drawStars');
  var html = '';
  for(var i = 0; i < 40; i++){
    var x = Math.random() * 100;
    var y = Math.random() * 100;
    var delay = Math.random() * 3;
    var size = Math.random() * 2 + 1;
    html += '<div class="draw-star" style="left:'+x+'%;top:'+y+'%;width:'+size+'px;height:'+size+'px;animation-delay:'+delay+'s"></div>';
  }
  container.innerHTML = html;
}

// --- Update today date display ---
function updateTodayDate(){
  var d = new Date();
  var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var weekdays = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  document.getElementById('todayDay').textContent = String(d.getDate()).padStart(2,'0');
  document.getElementById('todayDateMeta').textContent = months[d.getMonth()] + '.' + String(d.getDate()).padStart(2,'0') + ' · ' + weekdays[d.getDay()];
}
